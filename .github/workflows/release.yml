name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate artifacts without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release identity
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$PACKAGE_VERSION" =~ $SEMVER_RE ]] || { echo 'package version must be strict X.Y.Z SemVer' >&2; exit 1; }
          [ "$PACKAGE_VERSION" = "$LOCK_VERSION" ] || { echo 'package and lock versions differ' >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'release tag must be strict vX.Y.Z SemVer' >&2; exit 1; }
            [ "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION" ] || { echo 'tag, package, and lock versions must match' >&2; exit 1; }
          else
            [ '${{ inputs.dry_run }}' = true ] || { echo 'workflow_dispatch is dry-run only' >&2; exit 1; }
          fi
          CORE_VERSION="$PACKAGE_VERSION"
          CORE_RANGE=">=${PACKAGE_VERSION%.*}.0 <$(node -e "const [a,b]=process.argv[1].split('.').map(Number); process.stdout.write(a+'.'+(b+1)+'.0')" "$PACKAGE_VERSION")"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            gh release view "v$CORE_VERSION" --repo ryanycheng/Syrogo >/dev/null || { echo "Core release v$CORE_VERSION does not exist" >&2; exit 1; }
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "core_version=$CORE_VERSION" >> "$GITHUB_OUTPUT"
          echo "core_range=$CORE_RANGE" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test && npm run build
      - run: go test ./... && go vet ./...
      - run: bash scripts/install_test.sh
      - name: Generate metadata
        run: npm run release:metadata -- "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.core_version }}" "${{ steps.meta.outputs.core_range }}" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v${{ steps.meta.outputs.version }}"
          mkdir -p release
          for ARCH in amd64 arm64; do
            DIR="release/syrogo-console_${VERSION}_linux_${ARCH}"
            mkdir -p "$DIR/dist" "$DIR/deploy/systemd"
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath -o "$DIR/syrogo-console" ./cmd/syrogo-console
            cp -a dist/. "$DIR/dist/"
            cp scripts/install.sh "$DIR/install.sh"
            cp deploy/systemd/syrogo-console.service "$DIR/deploy/systemd/"
            tar -C release -czf "release/syrogo-console_${VERSION}_linux_${ARCH}.tar.gz" "$(basename "$DIR")"
            rm -rf "$DIR"
          done
          cp scripts/install.sh "release/install.sh"
          cp dist/syrogo-console-release.json release/
          (cd release && sha256sum syrogo-console_${VERSION}_linux_*.tar.gz install.sh syrogo-console-release.json > "syrogo-console_${VERSION}_checksums.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: syrogo-console-v${{ steps.meta.outputs.version }}
          path: release/
          if-no-files-found: error

      - name: Publish tag release
        if: github.event_name == 'push'
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "SyrogoConsole $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

    permissions:
      contents: write
